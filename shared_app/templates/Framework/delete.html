{% extends 'base.html' %}

{% block title %}
    Fw-delete
{% endblock %}

{% block content %}

<style>
    

        h1 {
            text-align: center;
            color: #85c5ed;
        }

        .button-group {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .messages {
            list-style: none;
            padding: 0;
            margin: 20px auto;
            text-align: center;
            width: fit-content;
            color: rgb(255, 0, 0);
        }
        
    .max {
        max-width: 600px;
        margin: 50px auto;
        margin-left: 500px;
        margin-top: 200px;
        background-color: #ffffff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
        

        a {
            background-color: white;
            color: #000;
            border-radius: 4px;
        }

    </style>

    <div class="max">

    <form action="{% url 'shared-app:framework-delete' obj.pk %}" method="post">
        {% csrf_token %}
        <h1>Are you sure to delete this?</h1>
        <div class="button-group">
            <button type="submit">Yes</button>
            <a href="{% url 'shared-app:framework-list' %}">No</a>
        </div>
    </form>
</div>

{% endblock %}
