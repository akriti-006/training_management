{% extends 'base.html' %}
{% load static %}

{% block title %}
    Fw-update
{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{% static 'shared-app/css/fw.css' %}">
{% endblock %}


{% block content %}
<style>
    input[type="text"],
    textarea,
    select {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
    }
</style>

    <div class="max">

      <h2>Update</h2>

      <form action="{% url 'shared-app:framework-update' obj.id %}" method="POST">
        {% csrf_token %}

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{obj.name}}"/>

        <label for="description">Description:</label>
        <textarea id="description" name="description" rows="4" cols="50">{{obj.description}}</textarea>

        <label for="language">Language</label>
        <select name="language" id="language">
            {% for pl in pl_obj %}
            <option value="{{pl.id}}" {% if obj.language.id == pl.id %} selected {% endif %}>{{pl.name}}</option>
            {% endfor %}
          </select>

        <div class="btn">
          <button type="submit">Update</button>
        </div>

        <div class="backBtn">
          <a href="{% url 'shared-app:framework-list' %}">Back</a>
        </div>

      </form>
    </div>

{% endblock %}
