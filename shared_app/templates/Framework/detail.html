{% extends 'base.html' %}

{% block title %}
    Fw-detail
{% endblock %}

{% block content %}
<style>
    
    body {
        background-color: #f4f6f9;
        margin: 0;
        padding: 0;
    }

    .max {
        max-width: 600px;
        margin: 50px auto;
        margin-left: 500px;
        background-color: #ffffff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    label {
        font-weight: bold;
        display: block;
        margin-bottom: 8px;
        color: #333;
    }

    input[type="text"],
    textarea,
    select {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
    }

    .btn {
        text-align: center;
    }

    button {
        background-color: #85c5ed;
        color: white;
        padding: 10px 25px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #85c5ed;
    }

    .backBtn {
        text-align: center;
        margin-top: 15px;
    }

</style>


<div class="max">
    <form action="{% url 'shared-app:framework-detail' obj.id %}" method="POST">
        {% csrf_token %}

        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" value="{{obj.name}}"><br><br>

        <label for="description">Description:</label><br>
        <textarea name="description" id="description" rows="4" cols="50">{{obj.description}}</textarea><br><br>

        <label for="language">Language:</label>
        <select name="language" id="language">
            <option value="Python">Python</option>
            <option value="C">C</option>
            <option value="C++">C++</option>
            <option value="Java">Java</option>
        </select>

        <div class="backBtn">
          <a href="{% url 'shared-app:framework-list'%}">⬅ Back</a>
        </div>
        
    </form>
</div>


{% endblock %}
