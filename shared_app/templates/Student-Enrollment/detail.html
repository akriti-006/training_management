{% extends 'base.html' %}

{% block title %}
    SE-detail
{% endblock %}

{% block content %}
<style>
      body {
        background-color: #f0f2f5;
        margin: 0;
        padding: 0;
      }

      h2 {
        text-align: center;
        margin-top: 30px;
        color: #333;
      }

      .max {
        max-width: 500px;
        margin: 40px auto;
        margin-left: 500px;
        margin-top: 50px;
        padding: 20px;
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
        color: #555;
      }

      input[type="text"],
      textarea {
        width: 90%;
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
        resize: vertical;
      }

      .btn {
        text-align: center;
      }

      button {
        background-color: #85c5ed;
        color: white;
        padding: 10px 25px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background-color: #85c5ed;
      }

      .backBtn {
  text-align: center;
  margin-top: 15px;
}

    </style>

<div class="max">
      <h2>Detail</h2>

      <ul class="messages">
        {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>

      <form action="{% url 'shared-app:course-enrollment-detail' obj.id %}" method="POST">
        {% csrf_token %}

        <label for="first_name">First Name:</label><br>
        <input type="text" id="first_name" name="first_name" value="{{obj.student.first_name}}" /><br><br>
        
        <label for="last_name">Last Name:</label><br>
        <input type="text" id="last_name" name="last_name" value="{{obj.student.last_name}}" /><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" value="{{obj.student.email}}"><br><br>

        <label for="course_name">Course Name:</label><br>
        <input type="text" id="course_name" name="course_name" value="{{obj.course.name}}"><br><br>

        <label for="course_fee">Course Fee:</label><br>
        <input type="text" id="course_fee" name="course_fee" value="{{obj.course.total_fee}}"><br><br>

      <div class="backBtn">
          <a href="{% url 'shared-app:course-enrollment-list' %}">⬅ Back</a>
        </div>

      </form>
    </div>

{% endblock %}
