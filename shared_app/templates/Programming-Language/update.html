{% extends 'base.html' %}
{% load static %}

{% block title %}
    PL-Update
{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{% static 'shared-app/css/pl.css' %}">
{% endblock %}

{% block content %}

    <div class="max">

    <h2>Update</h2>

    <form action="{% url 'shared-app:programming-language-update' obj.id %}" method="POST">
    {% csrf_token %}

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" value="{{obj.name}}"/>

    <label for="description">Description:</label>
    <textarea id="description" name="description" rows="4" cols="50">{{obj.description}}</textarea>

    <div class="btn">
    <button type="submit">Update</button>
    </div>

    <div class="backBtn">
    <a href="{% url 'shared-app:programming-language-list' %}">Back</a>
    </div>

    </form>
    </div>
{% endblock %}
