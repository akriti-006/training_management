{% extends 'base.html' %}
{% load static %}

{% block title %}
    CD-Add
{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{% static 'shared-app/css/cd.css' %}">
{% endblock %}

{% block content %}

<div class="max">
      <h2>Add Course Data</h2>
      <form id="add_form" action="{% url 'shared-app:course-data-add' %}" method="POST">
        {% csrf_token %}

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" />

        <label for="description">Description:</label>
        <textarea id="description" name="description" rows="4" cols="50"></textarea>

        <label>Language</label>
        <select name="language" id="language" >
          <option value="">-----</option>
          {% for obj in pl_obj %}
          <option value="{{obj.id}}">{{obj.name}}</option>
        {% endfor %}
        </select><br><br>

        <label for="framework">Framework:</label>
        <select name="framework" id="framework" multiple >
            <option value="">-------</option>
            {% for obj in fw_obj %}
            <option value="{{obj.id}}">{{obj.name}}</option>
            {% endfor %}
        </select><br><br>

        <label for="duration_in_weeks">Duration (in weeks):</label>
        <input type="number" id="duration_in_weeks" name="duration_in_weeks" value="{{obj.duration_in_weeks}}" />

        <label for="total_fee">Total Fee:</label>
        <input type="text" id="total_fee" name="total_fee" value="{{obj.total_fee}}" />

        <div class="btn">
          <button type="submit">Add</button>
        </div>

        <div class="backBtn">
          <a href="{% url 'shared-app:course-data-list' %}">Back</a>
        </div>

      </form>
    </div>

{% endblock %}

{% block scripts %}
<script>
   $(document).ready(function () {
    $('#add_form').on('submit', function (e) {
      e.preventDefault(); // Prevent form submission

      // Get the form values
      const name = $('#name').val().trim();
      const description = $('#description').val().trim();
      const language = $('#language').val().trim();
      const framework = $('#framework').val() || [];
      const duration_in_weeks = $('#duration_in_weeks').val().trim();
      const total_fee = $('#total_fee').val().trim();

      flag = 0

      if(name==0){
        console.log('name is invalid')
        $('#name').addClass( "error_class" );
        flag=1
      }
      else{
        $('#name').removeClass( "error_class" );
      }
      
      if(description==0){
        console.log('description is invalid')
        $('#description').addClass( "error_class" );
        flag=1
      }
      else{
        $('#description').removeClass( "error_class" );
      }
      

      if (language.length === 0) {
          console.log('Language is invalid');
          $('#language').addClass("error_class");
          flag = 1;
      } else {
          $('#language').removeClass("error_class");
      }

      
      if (framework.length === 0) {
          console.log('framework is invalid');
          $('#framework').addClass("error_class");
          flag = 1;
      } else {
          $('#framework').removeClass("error_class");
      }

       if (!duration_in_weeks || isNaN(duration_in_weeks)) {
          console.log('duration_in_weeks is invalid');
          $('#duration_in_weeks').addClass("error_class");
          flag = 1;
      } else {
          $('#duration_in_weeks').removeClass("error_class");
      }
      if (!total_fee || isNaN(total_fee)) {
          console.log('total_fee is invalid');
          $('#total_fee').addClass("error_class");
          flag = 1;
      } else {
          $('#total_fee').removeClass("error_class");
      }


      if(flag==1)
      {
        return;
      }

      // Log to console
      console.log("Form Data:");
      console.log("Name:", name);
      console.log("Description:", description);

      // Optionally submit the form after logging:

      out = confirm('are you sure you want to submit the data?')

      if(out==true){
        console.log('we will submit the form')
        this.submit();
      }
      else{
        console.log('we will not submit the form')
      }
      
    });
  });

</script>

{% endblock %}
