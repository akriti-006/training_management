{% extends 'base.html' %}
{% load static %}

{% block title %}Update User{% endblock %}

{% block css %}
<style>
    .form-box {
        max-width: 600px;
        margin: auto;
        padding: 20px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
    .form-label {
        font-weight: bold;
    }
    .form-group {
        margin-bottom: 15px;
    }
</style>
{% endblock %}

{% block content %}
<div class="main">
    <h2>Update User</h2>

    <div class="form-box">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">First Name</label>
                <input type="text" name="first_name" value="{{ user_obj.first_name }}" class="form-control" readonly>
            </div>

            <div class="form-group">
                <label class="form-label">Last Name</label>
                <input type="text" name="last_name" value="{{ user_obj.last_name }}" class="form-control" readonly>
            </div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <span>(You can not edit email ID as it's a username)</span>
                <input type="email" name="email" value="{{ user_obj.email }}" class="form-control" readonly>
            </div>

            <div class="form-group">
                <label class="form-label">Account Status</label>
                <label><input type="radio" name="is_active" value="True" {% if user_obj.is_active %}checked{% endif %}> Active</label>
                <label><input type="radio" name="is_active" value="False" {% if not user_obj.is_active %}checked{% endif %}> Inactive</label>
            </div>

            <div class="form-group">
                <label class="form-label">Change Password</label>
                <div class="input-group">
                    <input type="password" name="password" id="password" class="form-control" placeholder="Leave blank to keep current password">
                    <div class="input-group-append">
                        <span class="input-group-text" onclick="togglePassword()" style="cursor: pointer;">
                            <i id="eyeIcon" class="fa fa-eye-slash"></i>
                        </span>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-success">Update User</button>
            <a href="{% url 'shared-app:user-management' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}

<script>
function togglePassword() {
    const passwordField = document.getElementById("password");
    const icon = document.getElementById("eyeIcon");
    if (passwordField.type === "password") {
        passwordField.type = "text";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    } else {
        passwordField.type = "password";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    }
}
</script>

{% endblock %}
